
<!doctype html>
<html lang="de" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>4Aces-Racing – Admin</title>

  <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml">
  <link rel="stylesheet" href="/admin/team.css?v=5">
</head>
<body>
  <header class="team-brand">
    <img src="/assets/logo.png" alt="4Aces-Racing">
    <div>
      <strong>4ACES RACING</strong>
      <small>TEAM ADMINISTRATION · YOU NEVER RACE ALONE</small>
    </div>
    <a href="/" target="_blank" rel="noopener">Website öffnen ↗</a>
  </header>

  <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>
  <script src="/admin/preview.js?v=4"></script>
  <script>
  (function(){
    function brandToolbar(){
      const root=document.getElementById('nc-root');
      if(!root)return;
      const bars=Array.from(root.querySelectorAll('[class*="EditorToolbar"], [class*="AppHeader"]'));
      const bar=bars.find(el=>el.getBoundingClientRect().height>0 && el.className.includes('EditorToolbar')) || bars.find(el=>el.getBoundingClientRect().height>0);
      if(!bar)return;
      const existing=root.querySelector('.team-toolbar-brand');
      if(existing && existing.parentElement===bar)return;
      if(existing)existing.remove();
      const brand=document.createElement('div'); brand.className='team-toolbar-brand';
      const img=document.createElement('img'); img.src='/assets/logo.png'; img.alt='4Aces-Racing';
      const link=document.createElement('a'); link.href='/'; link.target='_blank'; link.rel='noopener noreferrer'; link.textContent='Website öffnen ↗';
      const intern=document.createElement("a"); intern.href="/members/"; intern.target="_blank"; intern.rel="noopener noreferrer"; intern.textContent="Intern verwalten ↗"; brand.append(img,link,intern); bar.appendChild(brand);
    }
    let pending=false;
    new MutationObserver(()=>{if(!pending){pending=true;requestAnimationFrame(()=>{pending=false;brandToolbar();});}}).observe(document.body,{childList:true,subtree:true});
    brandToolbar();
  })();
  </script>
</body>
</html>
